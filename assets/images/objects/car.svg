<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 車身 -->
  <rect x="10" y="10" width="180" height="50" fill="#333" rx="5"/>
  <rect x="20" y="15" width="160" height="40" fill="#555" rx="3"/>
  
  <!-- 車窗 -->
  <rect x="30" y="18" width="50" height="30" fill="#87CEEB" opacity="0.8" rx="2"/>
  <rect x="90" y="18" width="50" height="30" fill="#87CEEB" opacity="0.8" rx="2"/>
  <rect x="150" y="18" width="30" height="30" fill="#87CEEB" opacity="0.8" rx="2"/>
  
  <!-- 車頭燈 -->
  <rect x="0" y="25" width="15" height="20" fill="#FFD700" rx="2"/>
  <!-- 尾燈 -->
  <rect x="200" y="25" width="10" height="20" fill="#D32F2F" rx="2"/>
  
  <!-- 輪子 -->
  <circle cx="50" cy="65" r="15" fill="#222"/>
  <circle cx="50" cy="65" r="10" fill="#444"/>
  <circle cx="150" cy="65" r="15" fill="#222"/>
  <circle cx="150" cy="65" r="10" fill="#444"/>
</svg>