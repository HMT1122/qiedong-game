<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 馬路邊緣 -->
  <rect x="0" y="160" width="200" height="40" fill="#333"/>
  <line x1="0" y1="180" x2="200" y2="180" stroke="white" stroke-width="3" stroke-dasharray="20,15"/>
  
  <!-- 候車亭 (遠處) -->
  <g transform="translate(50, 40)" opacity="0.5">
    <path d="M0,0 L100,0 L110,20 L-10,20 Z" fill="#FFD700"/>
    <rect x="5" y="20" width="8" height="100" fill="#8B4513"/>
    <rect x="87" y="20" width="8" height="100" fill="#8B4513"/>
  </g>
  
  <!-- 人站在馬路邊 (危險) -->
  <g transform="translate(80, 100)" fill="#D32F2F">
    <circle cx="0" cy="-20" r="15"/>
    <rect x="-12" y="-5" width="24" height="40" rx="3"/>
    <rect x="-15" y="35" width="12" height="30" rx="2"/>
    <rect x="3" y="35" width="12" height="30" rx="2"/>
  </g>
  
  <!-- 危險標誌 -->
  <g transform="translate(100, 30)">
    <polygon points="0,-30 26,13 -26,13" fill="#D32F2F"/>
    <text x="0" y="5" font-family="Noto Sans TC" font-size="24" font-weight="bold" fill="white" text-anchor="middle">!</text>
  </g>
  
  <!-- 禁止標誌 -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#D32F2F" stroke-width="6"/>
  <line x1="65" y1="65" x2="135" y2="135" stroke="#D32F2F" stroke-width="6" stroke-linecap="round"/>
  
  <text x="100" y="185" font-family="Noto Sans TC" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">太靠近車道</text>
</svg>