<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 車道 (灰色) -->
  <rect x="0" y="0" width="200" height="200" fill="#444"/>
  
  <!-- 車道線 -->
  <g stroke="white" stroke-width="2" stroke-dasharray="15,10">
    <line x1="100" y1="0" x2="100" y2="200"/>
  </g>
  
  <!-- 人站在車道中央 (極度危險) -->
  <g transform="translate(100, 100)" fill="#D32F2F">
    <circle cx="0" cy="-20" r="15"/>
    <rect x="-12" y="-5" width="24" height="40" rx="3"/>
    <rect x="-15" y="35" width="12" height="30" rx="2"/>
    <rect x="3" y="35" width="12" height="30" rx="2"/>
  </g>
  
  <!-- 來車 (紅色警示) -->
  <g transform="translate(100, -50)" fill="#D32F2F">
    <rect x="-30" y="-20" width="60" height="40" rx="5"/>
    <rect x="-20" y="-15" width="40" height="25" rx="3" fill="#FF5252"/>
    <circle cx="-20" cy="10" r="8" fill="#222"/>
    <circle cx="20" cy="10" r="8" fill="#222"/>
  </g>
  
  <!-- 危險標誌 (大) -->
  <g transform="translate(100, 30)">
    <polygon points="0,-40 35,17 -35,17" fill="#D32F2F"/>
    <text x="0" y="7" font-family="Noto Sans TC" font-size="32" font-weight="bold" fill="white" text-anchor="middle">!</text>
  </g>
  
  <!-- 雙重禁止標誌 -->
  <g transform="translate(100, 140)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D32F2F" stroke-width="5"/>
    <line x1="-21" y1="-21" x2="21" y2="21" stroke="#D32F2F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#D32F2F" stroke-width="3" stroke-dasharray="5,5"/>
    <line x1="-32" y1="-32" x2="32" y2="32" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <text x="100" y="190" font-family="Noto Sans TC" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">直接站在行車道</text>
</svg>