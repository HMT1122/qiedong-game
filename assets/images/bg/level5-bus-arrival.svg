<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#sky7)"/>
  
  <!-- 校車到達學校 (車門打開) -->
  <g transform="translate(150, 180)">
    <!-- 車身主體 -->
    <rect x="0" y="0" width="650" height="240" fill="#FFD700" rx="10"/>
    <rect x="10" y="10" width="630" height="220" fill="#FFF8DC" rx="5"/>
    
    <!-- 車窗 -->
    <g fill="#87CEEB" opacity="0.7">
      <rect x="20" y="20" width="80" height="100" rx="3"/>
      <rect x="110" y="20" width="80" height="100" rx="3"/>
      <rect x="200" y="20" width="80" height="100" rx="3"/>
      <rect x="290" y="20" width="80" height="100" rx="3"/>
      <rect x="380" y="20" width="80" height="100" rx="3"/>
      <rect x="470" y="20" width="80" height="100" rx="3"/>
      <rect x="560" y="20" width="80" height="100" rx="3"/>
    </g>
    
    <!-- 前擋風玻璃 -->
    <path d="M10,20 L50,20 L30,120 L10,120 Z" fill="#87CEEB" opacity="0.7"/>
    
    <!-- 車門 (打開狀態) -->
    <g transform="translate(550, 120)">
      <!-- 門扇向外打開 -->
      <path d="M0,0 L-80,0 L-80,90 L0,90 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
      <rect x="-70" y="10" width="60" height="70" fill="#87CEEB" opacity="0.5" rx="3"/>
      <!-- 門把手 -->
      <circle cx="-20" cy="45" r="5" fill="#B8860B"/>
    </g>
    
    <!-- 車頭燈 -->
    <rect x="-10" y="40" width="15" height="40" fill="#FFD700" rx="3"/>
    <rect x="-10" y="160" width="15" height="40" fill="#FFD700" rx="3"/>
    
    <!-- 尾燈 -->
    <rect x="650" y="40" width="10" height="40" fill="#D32F2F" rx="3"/>
    <rect x="650" y="160" width="10" height="40" fill="#D32F2F" rx="3"/>
    
    <!-- 輪子 -->
    <g>
      <circle cx="100" cy="240" r="35" fill="#222"/>
      <circle cx="100" cy="240" r="25" fill="#444"/>
      <circle cx="100" cy="240" r="15" fill="#666"/>
      <circle cx="550" cy="240" r="35" fill="#222"/>
      <circle cx="550" cy="240" r="25" fill="#444"/>
      <circle cx="550" cy="240" r="15" fill="#666"/>
    </g>
    
    <!-- 校車文字 -->
    <text x="325" y="190" font-family="Noto Sans TC" font-size="36" font-weight="bold" fill="#D32F2F" text-anchor="middle">校車</text>
  </g>
  
  <!-- 學校建築背景 -->
  <g transform="translate(850, 100)" opacity="0.7">
    <rect x="0" y="0" width="300" height="300" fill="#DEB887" rx="5"/>
    <rect x="20" y="20" width="80" height="150" fill="#8B4513" rx="3"/>
    <rect x="110" y="20" width="80" height="150" fill="#8B4513" rx="3"/>
    <rect x="200" y="20" width="80" height="150" fill="#8B4513" rx="3"/>
    <polygon points="-10,0 150,-80 310,0" fill="#8B0000"/>
    <text x="150" y="330" font-family="Noto Sans TC" font-size="24" font-weight="bold" fill="#2E7D32" text-anchor="middle">茄苳國小</text>
  </g>
  
  <!-- 安全區域 (綠色區域，右側人行道) -->
  <rect x="850" y="450" width="400" height="200" fill="#4CAF50" opacity="0.2" stroke="#4CAF50" stroke-width="3" stroke-dasharray="10,5" rx="15"/>
  <text x="1050" y="520" font-family="Noto Sans TC" font-size="24" font-weight="bold" fill="#2E7D32" text-anchor="middle">✓ 安全區域</text>
  <text x="1050" y="560" font-family="Noto Sans TC" font-size="16" fill="#2E7D32" text-anchor="middle">人行道、綠色標線</text>
  
  <!-- 危險區域：車前 -->
  <rect x="200" y="450" width="180" height="120" fill="#D32F2F" opacity="0.2" stroke="#D32F2F" stroke-width="3" stroke-dasharray="10,5" rx="10"/>
  <text x="290" y="510" font-family="Noto Sans TC" font-size="18" font-weight="bold" fill="#D32F2F" text-anchor="middle">✗ 車前危險</text>
  <text x="290" y="540" font-family="Noto Sans TC" font-size="14" fill="#D32F2F" text-anchor="middle">死角</text>
  
  <!-- 危險區域：車後 -->
  <rect x="600" y="450" width="180" height="120" fill="#D32F2F" opacity="0.2" stroke="#D32F2F" stroke-width="3" stroke-dasharray="10,5" rx="10"/>
  <text x="690" y="510" font-family="Noto Sans TC" font-size="18" font-weight="bold" fill="#D32F2F" text-anchor="middle">✗ 車後危險</text>
  <text x="690" y="540" font-family="Noto Sans TC" font-size="14" fill="#D32F2F" text-anchor="middle">死角</text>
  
  <!-- 馬路 -->
  <rect x="0" y="580" width="1280" height="100" fill="#333"/>
  <g stroke="white" stroke-width="4" stroke-dasharray="40,30">
    <line x1="400" y1="580" x2="400" y2="680"/>
    <line x1="800" y1="580" x2="800" y2="680"/>
  </g>
  
  <!-- 人行道 -->
  <rect x="0" y="680" width="1280" height="40" fill="#D3D3D3"/>
  
  <!-- 樹木 -->
  <ellipse cx="100" cy="500" rx="40" ry="80" fill="#228B22" opacity="0.8"/>
  <rect x="95" y="560" width="10" height="70" fill="#8B4513"/>
  <ellipse cx="1180" cy="500" rx="40" ry="80" fill="#2E8B57" opacity="0.8"/>
  <rect x="1175" y="560" width="10" height="70" fill="#8B4513"/>
  
  <!-- 標示文字 -->
  <text x="640" y="80" font-family="Noto Sans TC" font-size="36" font-weight="bold" fill="#2E7D32" text-anchor="middle">校車到站・準備下車</text>
  <text x="640" y="130" font-family="Noto Sans TC" font-size="20" fill="#666" text-anchor="middle">等車停、依序排隊、走到安全區域</text>
</svg>