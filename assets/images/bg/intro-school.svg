<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8FBC8F"/>
      <stop offset="100%" style="stop-color:#556B2F"/>
    </linearGradient>
  </defs>
  
  <!-- 天空 -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  
  <!-- 太陽 -->
  <circle cx="1100" cy="100" r="60" fill="#FFD700" opacity="0.9"/>
  
  <!-- 雲朵 -->
  <g fill="white" opacity="0.8">
    <ellipse cx="200" cy="80" rx="50" ry="25"/>
    <ellipse cx="240" cy="70" rx="40" ry="20"/>
    <ellipse cx="280" cy="80" rx="35" ry="22"/>
    <ellipse cx="900" cy="120" rx="45" ry="22"/>
    <ellipse cx="940" cy="110" rx="35" ry="18"/>
    <ellipse cx="980" cy="120" rx="30" ry="20"/>
  </g>
  
  <!-- 學校建築 -->
  <g>
    <!-- 主建築 -->
    <rect x="300" y="200" width="400" height="300" fill="#DEB887" rx="5"/>
    <rect x="320" y="220" width="120" height="150" fill="#8B4513" rx="3"/>
    <rect x="460" y="220" width="120" height="150" fill="#8B4513" rx="3"/>
    <rect x="600" y="220" width="80" height="150" fill="#8B4513" rx="3"/>
    
    <!-- 屋頂 -->
    <polygon points="290,200 500,120 710,200" fill="#8B0000"/>
    
    <!-- 校門 -->
    <rect x="470" y="400" width="140" height="100" fill="#2E7D32" rx="10"/>
    <text x="540" y="460" font-family="Noto Sans TC" font-size="28" font-weight="bold" fill="white" text-anchor="middle">茄苳國小</text>
  </g>
  
  <!-- 地面 -->
  <rect y="500" width="1280" height="220" fill="url(#ground)"/>
  
  <!-- 人行道 -->
  <rect y="500" width="1280" height="60" fill="#D3D3D3"/>
  <g stroke="#999" stroke-width="2" stroke-dasharray="20,10">
    <line x1="0" y1="530" x2="1280" y2="530"/>
  </g>
  
  <!-- 馬路 -->
  <rect y="560" width="1280" height="80" fill="#444"/>
  <g stroke="white" stroke-width="4" stroke-dasharray="40,30">
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>
  
  <!-- 斑馬線 -->
  <g fill="white">
    <rect x="500" y="560" width="12" height="80"/>
    <rect x="530" y="560" width="12" height="80"/>
    <rect x="560" y="560" width="12" height="80"/>
    <rect x="590" y="560" width="12" height="80"/>
    <rect x="620" y="560" width="12" height="80"/>
  </g>
  
  <!-- 樹木 -->
  <g>
    <ellipse cx="150" cy="450" rx="40" ry="80" fill="#228B22"/>
    <rect x="145" y="510" width="10" height="50" fill="#8B4513"/>
    <ellipse cx="1100" cy="430" rx="50" ry="90" fill="#2E8B57"/>
    <rect x="1095" y="500" width="10" height="60" fill="#8B4513"/>
  </g>
  
  <!-- 茄苳樹葉子裝飾 -->
  <g fill="#2E7D32" opacity="0.3">
    <ellipse cx="100" cy="150" rx="30" ry="20" transform="rotate(-20 100 150)"/>
    <ellipse cx="1180" cy="180" rx="25" ry="18" transform="rotate(15 1180 180)"/>
  </g>
  
  <!-- 文字標示 -->
  <text x="640" y="150" font-family="Noto Sans TC" font-size="48" font-weight="900" fill="#2E7D32" text-anchor="middle" opacity="0.15">茄苳國小</text>
</svg>